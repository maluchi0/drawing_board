<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>인터넷 그림판</title>

    <!-- Open Graph Meta Tags -->
    <meta property="og:title" content="인터넷 그림판">
    <meta property="og:description" content="HTML5 Canvas 기반 그림판으로 그린 작품">
    <meta property="og:image" content="https://maluchi0.github.io/drawing_board/preview.png">
    <meta property="og:url" content="https://maluchi0.github.io/drawing_board/">
    <meta property="og:type" content="website">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">

    <!-- Twitter Card Meta Tags -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="인터넷 그림판">
    <meta name="twitter:description" content="HTML5 Canvas 기반 그림판으로 그린 작품">
    <meta name="twitter:image" content="https://maluchi0.github.io/drawing_board/preview.png">

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/toolbar.css">
    <link rel="stylesheet" href="css/share.css">
</head>
<body>
    <div class="container">
        <div class="toolbar">
            <div class="tool-group">
                <button class="tool-btn active" data-tool="select" title="선택">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M3 3l7.07 16.97 2.51-7.39 7.39-2.51L3 3z"></path>
                    </svg>
                    <span>선택</span>
                </button>
                <button class="tool-btn" data-tool="freeSelect" title="자유 선택">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M3 12 Q7 3, 12 5 T21 12 Q18 20, 12 18 T3 12 Z" fill="none" stroke-dasharray="5,5"></path>
                    </svg>
                    <span>자유선택</span>
                </button>
                <button class="tool-btn" data-tool="pen" title="펜">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M12 19l7-7 3 3-7 7-3-3z"></path>
                        <path d="M18 13l-1.5-7.5L2 2l3.5 14.5L13 18l5-5z"></path>
                        <path d="M2 2l7.586 7.586"></path>
                    </svg>
                    <span>펜</span>
                </button>
                <button class="tool-btn" data-tool="eraser" title="지우개">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M20 20H7L3 16l10-10 8 8-1 6z"></path>
                    </svg>
                    <span>지우개</span>
                </button>
                <button class="tool-btn" data-tool="line" title="직선">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="5" y1="19" x2="19" y2="5"></line>
                    </svg>
                    <span>직선</span>
                </button>
                <button class="tool-btn" data-tool="rectangle" title="사각형">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <rect x="3" y="3" width="18" height="18" rx="2"></rect>
                    </svg>
                    <span>사각형</span>
                </button>
                <button class="tool-btn" data-tool="circle" title="원">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="12" cy="12" r="9"></circle>
                    </svg>
                    <span>원</span>
                </button>
                <button class="tool-btn" data-tool="text" title="텍스트">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <polyline points="4 7 4 4 20 4 20 7"></polyline>
                        <line x1="9" y1="20" x2="15" y2="20"></line>
                        <line x1="12" y1="4" x2="12" y2="20"></line>
                    </svg>
                    <span>텍스트</span>
                </button>
                <button class="tool-btn" data-tool="image" title="이미지">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
                        <circle cx="8.5" cy="8.5" r="1.5"></circle>
                        <polyline points="21 15 16 10 5 21"></polyline>
                    </svg>
                    <span>이미지</span>
                </button>
                <button class="tool-btn" data-tool="paint" title="페인트">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M12 2a10 10 0 0 1 10 10c0 6-4 9-9 9H9a2 2 0 0 1-2-2 1 1 0 0 1 1-1h3a4 4 0 0 0 4-4V9a2 2 0 1 1 4 0c0 4-3 7-7 7h-1"></path>
                        <circle cx="7.5" cy="15.5" r="0.5" fill="currentColor"></circle>
                    </svg>
                    <span>페인트</span>
                </button>
                <button class="tool-btn" data-tool="eyedropper" title="스포이트">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M18 3l3 3-3 3-3-3 3-3z"></path>
                        <path d="M13 8l-9 9 3 3 9-9"></path>
                        <circle cx="5" cy="19" r="2"></circle>
                    </svg>
                    <span>스포이트</span>
                </button>
            </div>

            <div class="divider"></div>

            <div class="option-group">
                <div class="option-item">
                    <label>색상</label>
                    <div class="color-swatch-container">
                        <!-- 포토샵 스타일: 겹쳐진 두 개의 사각형 -->
                        <div class="color-swatch-wrapper">
                            <div class="color-swatch-bg" id="bgColorSwatch" title="배경색 (클릭하여 전환)"></div>
                            <div class="color-swatch-fg" id="fgColorSwatch" title="전경색 (클릭하여 전환)"></div>
                        </div>
                        <!-- 숨겨진 color picker들 -->
                        <input type="color" id="fgColorPicker" value="#000000" style="display:none;">
                        <input type="color" id="bgColorPicker" value="#ffffff" style="display:none;">
                        <!-- 리셋 아이콘 (기본 흑백으로) -->
                        <button class="color-reset-btn" id="colorResetBtn" title="기본 색상 (D)">
                            <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor">
                                <rect x="2" y="2" width="6" height="6" />
                                <rect x="8" y="8" width="6" height="6" fill="white" stroke="currentColor"/>
                            </svg>
                        </button>
                        <!-- 전환 화살표 아이콘 -->
                        <button class="color-swap-btn" id="colorSwapBtn" title="전경색/배경색 전환 (X)">
                            <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M3 8 L8 3 M8 3 L13 8 M8 13 L3 8 M13 8 L8 13"/>
                            </svg>
                        </button>
                    </div>
                </div>
                <div class="option-item">
                    <label for="lineWidth">두께: <span id="lineWidthValue">5</span></label>
                    <input type="range" id="lineWidth" min="1" max="20" value="5">
                </div>
                <div class="option-item">
                    <label for="opacity">투명도: <span id="opacityValue">100</span>%</label>
                    <input type="range" id="opacity" min="0" max="100" value="100">
                </div>
                <div class="option-item">
                    <label for="fontSize">폰트: <span id="fontSizeValue">16</span>px</label>
                    <input type="range" id="fontSize" min="12" max="72" value="16">
                </div>
                <div class="option-item">
                    <label>캔버스 크기</label>
                    <div class="canvas-size-controls">
                        <input type="number" id="canvasWidth" min="400" max="2400" value="1200" step="50">
                        <span>×</span>
                        <input type="number" id="canvasHeight" min="300" max="1600" value="800" step="50">
                        <button class="action-btn-small" id="resizeCanvasBtn" title="크기 적용">적용</button>
                    </div>
                </div>
            </div>

            <div class="divider"></div>

            <div class="action-group">
                <button class="action-btn" id="deleteBtn" title="선택 항목 삭제">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M3 6h18"></path>
                        <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
                        <line x1="10" y1="11" x2="10" y2="17"></line>
                        <line x1="14" y1="11" x2="14" y2="17"></line>
                    </svg>
                    <span>삭제</span>
                </button>
                <button class="action-btn" id="clearBtn" title="전체 지우기">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <polyline points="3 6 5 6 21 6"></polyline>
                        <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
                    </svg>
                    <span>전체 지우기</span>
                </button>
                <button class="action-btn" id="undoBtn" title="실행 취소">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M3 7v6h6"></path>
                        <path d="M21 17a9 9 0 00-9-9 9 9 0 00-6 2.3L3 13"></path>
                    </svg>
                    <span>Undo</span>
                </button>
                <button class="action-btn" id="redoBtn" title="다시 실행">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M21 7v6h-6"></path>
                        <path d="M3 17a9 9 0 019-9 9 9 0 016 2.3l3 2.7"></path>
                    </svg>
                    <span>Redo</span>
                </button>
                <button class="action-btn" id="saveBtn" title="이미지 저장">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path>
                        <polyline points="17 21 17 13 7 13 7 21"></polyline>
                        <polyline points="7 3 7 8 15 8"></polyline>
                    </svg>
                    <span>저장</span>
                </button>
                <button class="action-btn" id="pdfBtn" title="PDF 생성">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                        <polyline points="14 2 14 8 20 8"></polyline>
                        <line x1="16" y1="13" x2="8" y2="13"></line>
                        <line x1="16" y1="17" x2="8" y2="17"></line>
                        <polyline points="10 9 9 9 8 9"></polyline>
                    </svg>
                    <span>PDF</span>
                </button>
                <button class="action-btn" id="shareBtn" title="공유하기">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="18" cy="5" r="3"></circle>
                        <circle cx="6" cy="12" r="3"></circle>
                        <circle cx="18" cy="19" r="3"></circle>
                        <line x1="8.59" y1="13.51" x2="15.42" y2="17.49"></line>
                        <line x1="15.41" y1="6.51" x2="8.59" y2="10.49"></line>
                    </svg>
                    <span>공유</span>
                </button>
                <button class="action-btn" id="saveProjectBtn" title="작업 저장">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path>
                        <polyline points="17 21 17 13 7 13 7 21"></polyline>
                        <polyline points="7 3 7 8 15 8"></polyline>
                    </svg>
                    <span>프로젝트 저장</span>
                </button>
                <button class="action-btn" id="openProjectBtn" title="작업 불러오기">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M3 7v10a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-6l-2-2H5a2 2 0 0 0-2 2z"></path>
                    </svg>
                    <span>불러오기</span>
                </button>
            </div>
        </div>

        <div class="canvas-container">
            <canvas id="drawingCanvas"></canvas>
        </div>
    </div>

    <!-- Save/Load 다이얼로그 -->
    <div id="saveLoadDialog" class="dialog-overlay" style="display:none;">
        <div class="dialog-content">
            <div class="dialog-header">
                <h3 id="dialogTitle">작업 저장/불러오기</h3>
                <button class="dialog-close" id="closeDialogBtn">&times;</button>
            </div>
            <div class="dialog-body">
                <div id="saveSlots" class="save-slots">
                    <!-- 슬롯 1-5 -->
                    <div class="save-slot" data-slot="1">
                        <div class="slot-preview">
                            <canvas class="slot-canvas" width="120" height="80"></canvas>
                        </div>
                        <div class="slot-info">
                            <div class="slot-name">슬롯 1</div>
                            <div class="slot-date">비어있음</div>
                        </div>
                        <div class="slot-actions">
                            <button class="slot-save-btn">저장</button>
                            <button class="slot-load-btn" disabled>불러오기</button>
                            <button class="slot-delete-btn" disabled>삭제</button>
                        </div>
                    </div>
                    <div class="save-slot" data-slot="2">
                        <div class="slot-preview">
                            <canvas class="slot-canvas" width="120" height="80"></canvas>
                        </div>
                        <div class="slot-info">
                            <div class="slot-name">슬롯 2</div>
                            <div class="slot-date">비어있음</div>
                        </div>
                        <div class="slot-actions">
                            <button class="slot-save-btn">저장</button>
                            <button class="slot-load-btn" disabled>불러오기</button>
                            <button class="slot-delete-btn" disabled>삭제</button>
                        </div>
                    </div>
                    <div class="save-slot" data-slot="3">
                        <div class="slot-preview">
                            <canvas class="slot-canvas" width="120" height="80"></canvas>
                        </div>
                        <div class="slot-info">
                            <div class="slot-name">슬롯 3</div>
                            <div class="slot-date">비어있음</div>
                        </div>
                        <div class="slot-actions">
                            <button class="slot-save-btn">저장</button>
                            <button class="slot-load-btn" disabled>불러오기</button>
                            <button class="slot-delete-btn" disabled>삭제</button>
                        </div>
                    </div>
                    <div class="save-slot" data-slot="4">
                        <div class="slot-preview">
                            <canvas class="slot-canvas" width="120" height="80"></canvas>
                        </div>
                        <div class="slot-info">
                            <div class="slot-name">슬롯 4</div>
                            <div class="slot-date">비어있음</div>
                        </div>
                        <div class="slot-actions">
                            <button class="slot-save-btn">저장</button>
                            <button class="slot-load-btn" disabled>불러오기</button>
                            <button class="slot-delete-btn" disabled>삭제</button>
                        </div>
                    </div>
                    <div class="save-slot" data-slot="5">
                        <div class="slot-preview">
                            <canvas class="slot-canvas" width="120" height="80"></canvas>
                        </div>
                        <div class="slot-info">
                            <div class="slot-name">슬롯 5</div>
                            <div class="slot-date">비어있음</div>
                        </div>
                        <div class="slot-actions">
                            <button class="slot-save-btn">저장</button>
                            <button class="slot-load-btn" disabled>불러오기</button>
                            <button class="slot-delete-btn" disabled>삭제</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- jsPDF Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

    <script src="js/utils.js?v=1.9.2"></script>
    <script src="js/objectManager.js?v=1.9.2"></script>
    <script src="js/tools.js?v=1.9.2"></script>
    <script src="js/canvas.js?v=1.9.2"></script>
    <script src="js/pdfExporter.js?v=1.9.2"></script>
    <script src="js/shareManager.js?v=1.9.2"></script>
    <script src="js/toolbar.js?v=1.9.2"></script>
    <script src="js/app.js?v=1.9.2"></script>
</body>
</html>
